<main>
<div class="wrapx"><h1 class="greet" style="font-size:28px">💳 আমার বকেয়া</h1><p id="note"></p>
<div class="stat-grid" id="top"></div>
<h4 class="lab">বাকি বকেয়া</h4><div id="un"></div>
<h4 class="lab">পরিশোধের ইতিহাস</h4><div id="pd"></div></div>
<script>const URL_='https://dgsxzwutsstfsezvlkmh.supabase.co',KEY='sb_publishable_27L6UJCzRDDD9xEZ4733OQ_dLsY0oDE';const $=id=>document.getElementById(id);const tk=sessionStorage.getItem('mtk');const bn=n=>Number(n).toLocaleString('bn-BD');const dfmt=d=>new Date(d).toLocaleDateString('bn-BD');
async function rpc(n,b){try{const r=await fetch(URL_+'/rest/v1/rpc/'+n,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(b)});return r.ok?await r.json():null;}catch(e){return null;}}
const sm=a=>a.reduce((s,x)=>s+Number(x.amount||0),0);
function stat(cls,v,l){const d=document.createElement('div');d.className='stat '+cls;d.innerHTML='<b></b><small></small>';d.children[0].textContent=v;d.children[1].textContent=l;$('top').appendChild(d);}
function entry(box,x,paid){const e=document.createElement('div');e.className='entry '+(paid?'paid':'due');
 const l=document.createElement('div');const b=document.createElement('b');b.textContent=x.month+' মাস';const s=document.createElement('small');
 s.textContent=paid?('✓ পরিশোধিত'+(x.paid_on?' • '+dfmt(x.paid_on):'')+(x.note?' • '+x.note:'')):('বকেয়া'+(x.note?' • '+x.note:''));
 l.appendChild(b);l.appendChild(document.createElement('br'));l.appendChild(s);
 const a=document.createElement('div');a.className='amt'+(paid?' in':'');a.textContent='৳ '+bn(x.amount);e.appendChild(l);e.appendChild(a);box.appendChild(e);}
(async()=>{const d=await rpc('member_me',{p_token:tk});if(!d){$('note').textContent='তথ্য আনা যায়নি। আবার লগইন করে দেখুন।';return;}
 const D=d.dues||[];const un=D.filter(x=>!x.paid),pd=D.filter(x=>x.paid);
 stat('red','৳ '+bn(sm(un)),'মোট বাকি বকেয়া');stat('amber',bn(un.length),'বাকি মাস');stat('green','৳ '+bn(sm(pd)),'পরিশোধিত বকেয়া');
 un.forEach(x=>entry($('un'),x,false));pd.forEach(x=>entry($('pd'),x,true));
 if(!un.length)$('un').textContent='আলহামদুলিল্লাহ, আপনার কোনো বাকি বকেয়া নেই।';
 if(!pd.length)$('pd').textContent='এখনও কোনো বকেয়া পরিশোধের ইতিহাস নেই।';})();
</script>
