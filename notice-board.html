<div class="wrapx"><h1 class="greet" style="font-size:28px">📢 নোটিশ বোর্ড</h1><p id="note"></p><div id="list"></div></div>
<script>const URL_='https://dgsxzwutsstfsezvlkmh.supabase.co',KEY='sb_publishable_27L6UJCzRDDD9xEZ4733OQ_dLsY0oDE';const $=id=>document.getElementById(id);const tk=sessionStorage.getItem('mtk');const bn=n=>Number(n).toLocaleString('bn-BD');const dfmt=d=>new Date(d).toLocaleDateString('bn-BD');
async function rpc(n,b){try{const r=await fetch(URL_+'/rest/v1/rpc/'+n,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(b)});return r.ok?await r.json():null;}catch(e){return null;}}
function tag(t,cls){const s=document.createElement('span');s.className='tg '+cls;s.textContent=t;return s;}
(async()=>{const d=await rpc('member_notices',{p_token:tk});if(d===null){$('note').textContent='নোটিশ আনা যায়নি। আবার লগইন করে দেখুন।';return;}
 if(!d.length){$('note').textContent='এখন কোনো নোটিশ নেই।';return;}
 d.forEach(x=>{const c=document.createElement('div');c.className='cm'+(x.kind==='জরুরি'?'':' mine');const h=document.createElement('div');h.className='ch';
  const b=document.createElement('b');b.textContent=x.title;b.style.fontSize='18px';h.appendChild(b);h.appendChild(tag(x.kind,x.kind==='জরুরি'?'r':'b'));if(x.pinned)h.appendChild(tag('📌','y'));
  const dt=document.createElement('small');dt.textContent=dfmt(x.created_at);dt.style.marginLeft='auto';h.appendChild(dt);c.appendChild(h);
  if(x.body){const p=document.createElement('p');p.textContent=x.body;p.style.cssText='white-space:pre-wrap;margin:8px 0';c.appendChild(p);}
  $('list').appendChild(c);});})();
</script>
