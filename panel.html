<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>অ্যাডমিন | সিরাতুল মুস্তাকিম</title><link rel="stylesheet" href="admin-dark.css"></head><body>
<header><strong>অ্যাডমিন প্যানেল</strong><button class="alt hide" id="out">লগআউট</button></header><main>
<div class="box" id="login"><h3>লগইন করুন</h3>
<label>ইমেইল<input id="em" type="email" autocomplete="username"></label>
<label>পাসওয়ার্ড<input id="pw" type="password" autocomplete="current-password"></label>
<button id="go">প্রবেশ করুন</button><p id="msg"></p></div>
<div class="dash hide" id="dash">
<a class="dcard blue" href="requests.html"><span>📥</span><b id="n_req">–</b><small>সাহায্যের আবেদন</small></a>
<a class="dcard green" href="members.html"><span>👥</span><b id="n_mem">–</b><small>সদস্য</small></a>
<a class="dcard amber" href="members.html?f=pending"><span>🆕</span><b id="n_pen">–</b><small>অনুমোদনের অপেক্ষায়</small></a>
<a class="dcard purple" href="chanda.html"><span>💰</span><b id="n_pay">–</b><small>এই মাসে জমা</small></a>
<a class="dcard pink" href="donations.html"><span>💚</span><b id="n_don">–</b><small>অনুদান যাচাই বাকি</small></a>
<a class="dcard cyan" href="acts.html"><span>🤝</span><b id="n_act">–</b><small>কার্যক্রম</small></a>
<a class="dcard green" href="ledger.html"><span>💰</span><b id="n_tot">–</b><small>মোট টাকার পরিমাণ</small></a>
<a class="dcard pink" href="ledger.html"><span>💸</span><b id="n_exp">–</b><small>মোট খরচ</small></a>
<a class="dcard purple" href="ledger.html"><span>🏦</span><b id="n_bal">–</b><small>অবশিষ্ট টাকা</small></a>
<a class="dcard red" href="chanda.html"><span>💳</span><b id="n_dues">–</b><small>মোট বকেয়া টাকা</small></a>
<a class="dcard amber" href="chanda.html"><span>⏰</span><b id="n_due">–</b><small>এই মাসে বকেয়া সদস্য</small></a>
<a class="dcard cyan" href="#" id="c1"><span>⬇️</span><b>CSV</b><small>সদস্য তালিকা</small></a>
<a class="dcard amber" href="#" id="c2"><span>⬇️</span><b>CSV</b><small>সাহায্যের আবেদন</small></a>
<a class="dcard lime" href="#" id="c3"><span>⬇️</span><b>CSV</b><small>অনুদানের তালিকা</small></a>
</div></main>
<script>
const URL_='https://dgsxzwutsstfsezvlkmh.supabase.co',KEY='sb_publishable_27L6UJCzRDDD9xEZ4733OQ_dLsY0oDE';
const $=id=>document.getElementById(id);const token=sessionStorage.getItem('tk');const bn=n=>Number(n).toLocaleString('bn-BD');
const cur=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');};
async function api(p,o={}){const r=await fetch(URL_+'/rest/v1/'+p,{...o,headers:{apikey:KEY,Authorization:'Bearer '+token,'Content-Type':'application/json',Prefer:'return=minimal'}});
 if(r.status===401){sessionStorage.removeItem('tk');location.href='panel.html';return null;}
 if(!r.ok){alert('কাজ হয়নি: '+await r.text());throw 0;}const t=await r.text();return t?JSON.parse(t):null;}
async function login(){$('msg').textContent='';
 try{const r=await fetch(URL_+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:$('em').value.trim(),password:$('pw').value})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok||!j.access_token){const raw=j.msg||j.error_description||j.message||j.error||'অজানা কারণ';
   const tip=/not confirmed/i.test(raw)?'ইমেইল নিশ্চিত করা হয়নি।':/invalid login/i.test(raw)?'ইমেইল বা পাসওয়ার্ড মিলছে না।':/rate|too many/i.test(raw)?'অনেকবার চেষ্টা হয়েছে, কিছুক্ষণ পর আবার চেষ্টা করুন।':'';
   $('msg').textContent=tip+' ['+r.status+': '+raw+']';return;}
  sessionStorage.setItem('tk',j.access_token);location.reload();
 }catch(e){$('msg').textContent='সংযোগে সমস্যা: '+e.message;}}
function logout(){sessionStorage.removeItem('tk');location.reload();}
async function counts(){try{
 const [m,r,d,p]=await Promise.all([api('members?select=id,status&active=eq.true'),api('help_requests?select=id'),api('donations?select=id,verified'),api('payments?select=amount,member_id&month=eq.'+cur())]);
 $('n_mem').textContent=bn(m.filter(x=>x.status==='approved').length);$('n_pen').textContent=bn(m.filter(x=>x.status==='pending').length);
 $('n_req').textContent=bn(r.length);$('n_don').textContent=bn(d.filter(x=>!x.verified).length);
 $('n_pay').textContent='৳ '+bn(p.reduce((s,x)=>s+Number(x.amount),0));$('n_due').textContent=bn(m.filter(x=>x.status==='approved'&&!p.some(y=>y.member_id===x.id)).length);}catch(e){}
 try{const [ap,pa,dn,lg]=await Promise.all([api('activities?select=id'),api('payments?select=amount'),api('donations?select=amount,verified'),api('ledger?select=kind,amount')]);
  $('n_act').textContent=bn(ap.length);const inc=pa.reduce((s,x)=>s+Number(x.amount),0)+dn.filter(x=>x.verified).reduce((s,x)=>s+Number(x.amount),0)+lg.filter(x=>x.kind==='income').reduce((s,x)=>s+Number(x.amount),0);
  const ex=lg.filter(x=>x.kind==='expense').reduce((s,x)=>s+Number(x.amount),0);$('n_tot').textContent='৳ '+bn(inc);$('n_exp').textContent='৳ '+bn(ex);$('n_bal').textContent='৳ '+bn(inc-ex);}catch(e){}
 try{const r=await fetch(URL_+'/rest/v1/dues?select=amount&paid=eq.false',{headers:{apikey:KEY,Authorization:'Bearer '+token}});if(r.ok){const x=await r.json();$('n_dues').textContent='৳ '+bn(x.reduce((s,y)=>s+Number(y.amount),0));}}catch(e){}}
async function dl(path,cols,name){const rows=await api(path)||[];
 const q=v=>{let s=String(v??'');if(/^[=+\-@]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';};
 const lines=[cols.map(c=>q(c[1])).join(',')].concat(rows.map(r=>cols.map(c=>q(r[c[0]])).join(',')));
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv;charset=utf-8'}));a.download=name+'.csv';a.click();}
$('go').onclick=login;$('out').onclick=logout;$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')login();});
$('c1').onclick=e=>{e.preventDefault();dl('members?select=name,phone,area,occupation,status,monthly_amount,created_at&active=eq.true&order=name',[['name','নাম'],['phone','ফোন'],['area','ঠিকানা'],['occupation','পেশা'],['status','অবস্থা'],['monthly_amount','মাসিক চাঁদা'],['created_at','তারিখ']],'members');};
$('c2').onclick=e=>{e.preventDefault();dl('help_requests?select=*&order=created_at.desc',[['created_at','তারিখ'],['name','নাম'],['phone','ফোন'],['area','এলাকা'],['type','ধরন'],['details','বিবরণ']],'help_requests');};
$('c3').onclick=e=>{e.preventDefault();dl('donations?select=*&order=created_at.desc',[['created_at','তারিখ'],['donor_name','নাম'],['method','মাধ্যম'],['amount','পরিমাণ'],['sender_number','প্রেরকের নম্বর'],['trx_id','TrxID'],['note','মন্তব্য'],['verified','যাচাই']],'donations');};
if(token){$('login').classList.add('hide');$('dash').classList.remove('hide');$('out').classList.remove('hide');counts();}
</script></body></html>
